<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>BugBond</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand" id="brand">BugBond</h1>
    <nav aria-label="Drawers" id="tabs" class="tabs"></nav>
    <div class="top-r" id="topr"></div>
  </div>
  <div id="banners" aria-live="polite"></div>
  <div id="fixbar" class="fixbar" hidden></div>
</header>
<main>
  <noscript><p class="bar-msg fail">This app needs JavaScript.</p></noscript>
  <div class="headline" id="headline"></div>
  <div class="board">
    <section class="pane" id="panel-submit" aria-label="Reports" tabindex="-1"></section>
    <section class="pane" id="panel-run" aria-label="Console" tabindex="-1"></section>
    <section class="pane" id="panel-overview" aria-label="For a maintainer" tabindex="-1"></section>
  </div>
</main>
<dialog id="confirm" aria-labelledby="confirm-title" class="modal">
  <div id="confirm-bars" class="dbars"></div>
  <h2 id="confirm-title">Approve payment</h2>
  <div class="amt"><span class="num" id="confirm-amt">$0.25</span><span class="mute" id="confirm-info"></span></div>
  <dl class="kv">
    <dt>Input</dt><dd id="confirm-what"></dd>
    <dt>Wallet</dt><dd id="confirm-wallet" class="mono"></dd>
    <dt>Budget left</dt><dd id="confirm-budget"></dd>
  </dl>
  <div class="actions end">
    <button id="confirm-cancel" type="button" class="btn" autofocus>Cancel</button>
    <button id="confirm-ok" type="button" class="btn primary">Approve</button>
  </div>
</dialog>
<dialog id="ledger" aria-labelledby="ledger-title" class="drawer wide">
  <div class="drawer-h"><h2 id="ledger-title">Ledger</h2><button id="ledger-close" type="button" class="btn icon-btn" aria-label="Close"></button></div>
  <div id="ledger-bars" class="dbars"></div>
  <div class="drawer-b"><section id="panel-results" aria-labelledby="ledger-title"></section></div>
</dialog>
<dialog id="agent" aria-labelledby="agent-title" class="drawer wide">
  <div class="drawer-h"><h2 id="agent-title">Agent</h2><button id="agent-close" type="button" class="btn icon-btn" aria-label="Close"></button></div>
  <div id="agent-bars" class="dbars"></div>
  <div class="drawer-b"><section id="panel-policy" aria-labelledby="agent-title"></section></div>
</dialog>
<dialog id="trust" aria-labelledby="trust-title" class="drawer">
  <div class="drawer-h"><h2 id="trust-title">Log verification</h2><button id="trust-close" type="button" class="btn icon-btn" aria-label="Close"></button></div>
  <div id="trust-bars" class="dbars"></div>
  <div id="trust-body" class="drawer-b"></div>
</dialog>
<script src="evidence.js"></script>
<script src="app.js"></script>
</body>
</html>
